<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nebula Browser</title>
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>
  <div id="app">
    <canvas id="bg-canvas"></canvas>
    <div class="browser-chrome">
      <div class="titlebar" id="titlebar">
        <div class="window-controls">
          <button class="win-btn minimize" data-action="minimize" title="Minimize">−</button>
          <button class="win-btn maximize" data-action="maximize" title="Maximize">□</button>
          <button class="win-btn close" data-action="close" title="Close">×</button>
        </div>
        <div class="tab-strip" id="tab-strip">
          <button class="new-tab-btn" id="new-tab-btn" title="New Tab">+</button>
        </div>
        <div class="titlebar-spacer"></div>
        <div class="ai-toggle" id="ai-toggle" title="Nebula AI (Ctrl+K)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2z"/>
            <path d="M12 16v-4"/>
            <path d="M12 8h.01"/>
          </svg>
        </div>
      </div>
      <div class="toolbar">
        <div class="nav-controls">
          <button class="nav-btn" id="back-btn" title="Back (Alt+←)" disabled>←</button>
          <button class="nav-btn" id="forward-btn" title="Forward (Alt+→)" disabled>→</button>
          <button class="nav-btn" id="reload-btn" title="Reload (Ctrl+R)">⟳</button>
          <button class="nav-btn" id="home-btn" title="Home">⌂</button>
        </div>
        <div class="url-bar-container">
          <div class="url-bar-wrapper">
            <svg class="url-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 10V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 18v-2"/>
              <path d="M3.9 12a9 9 0 0 1 16.2 0"/>
              <path d="M12 2v20"/>
            </svg>
            <input type="text" class="url-input" id="url-input" placeholder="Search or enter address" spellcheck="false" autocomplete="off">
            <div class="url-actions">
              <button class="url-action" id="bookmark-btn" title="Bookmark (Ctrl+D)">☆</button>
              <button class="url-action" id="ai-btn" title="Ask Nebula">◆</button>
            </div>
          </div>
          <div class="suggestions" id="suggestions" hidden></div>
        </div>
        <div class="toolbar-actions">
          <button class="toolbar-btn" id="extensions-btn" title="Extensions">⋮</button>
          <button class="toolbar-btn" id="settings-btn" title="Settings (Ctrl+,)">⚙</button>
        </div>
      </div>
      <div class="ai-panel" id="ai-panel" hidden>
        <div class="ai-header">
          <span>Nebula AI</span>
          <button class="ai-close" id="ai-close">×</button>
        </div>
        <div class="ai-messages" id="ai-messages"></div>
        <div class="ai-input-area">
          <textarea class="ai-input" id="ai-input" placeholder="Ask Nebula anything..." rows="1"></textarea>
          <button class="ai-send" id="ai-send">▶</button>
        </div>
      </div>
    </div>
    <div class="webview-container" id="webview-container"></div>
    <div class="command-palette" id="command-palette" hidden>
      <input type="text" class="cmd-input" id="cmd-input" placeholder="Type a command..." spellcheck="false">
      <div class="cmd-results" id="cmd-results"></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
