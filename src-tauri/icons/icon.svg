<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#03040c"/>
      <stop offset="100%" style="stop-color:#0a0d1a"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="50%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="90" fill="none" stroke="url(#ring)" stroke-width="6" filter="url(#glow)"/>
  <path d="M128 60 C128 60 160 60 160 95 C160 130 128 170 128 170 C128 170 96 130 96 95 C96 60 128 60 128 60 Z" fill="url(#ring)" opacity="0.9" filter="url(#glow)"/>
  <circle cx="128" cy="128" r="12" fill="#03040c"/>
  <circle cx="128" cy="128" r="6" fill="url(#ring)"/>
  <path d="M128 95 L128 115" stroke="#00d4ff" stroke-width="3" stroke-linecap="round"/>
</svg>
